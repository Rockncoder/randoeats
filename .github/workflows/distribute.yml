name: Build and Distribute

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'both'
        type: choice
        options:
          - ios
          - android
          - both

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  # ============================================
  # Increment Build Number
  # ============================================
  increment-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      build_number: ${{ steps.bump.outputs.build_number }}

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Increment build number
        id: bump
        run: |
          # Get current version line
          VERSION_LINE=$(grep "^version:" pubspec.yaml)
          echo "Current: $VERSION_LINE"

          # Keep major.minor; the patch tracks the build number so the version
          # reads major.minor.<build> and increases by one on every push.
          BASE=$(echo $VERSION_LINE | sed 's/version: //' | cut -d'+' -f1)
          MAJOR_MINOR=$(echo $BASE | cut -d'.' -f1,2)
          CURRENT_BUILD=$(echo $VERSION_LINE | cut -d'+' -f2)
          NEW_BUILD=$((CURRENT_BUILD + 1))
          NEW_VERSION="${MAJOR_MINOR}.${NEW_BUILD}+${NEW_BUILD}"

          echo "Version: $BASE -> $NEW_VERSION (build $CURRENT_BUILD -> $NEW_BUILD)"

          # Update pubspec.yaml
          sed -i "s/^version: .*/version: ${NEW_VERSION}/" pubspec.yaml

          # Output for other jobs
          echo "build_number=$NEW_BUILD" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit build number
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add pubspec.yaml
          git diff --staged --quiet || git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push

  # ============================================
  # Android Build
  # ============================================
  android:
    needs: increment-build
    if: github.event.inputs.platform != 'ios'
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # This job runs on the Mac Mini self-hosted runner, which keeps its
      # files between jobs, so Flutter comes from FVM (provisioned once)
      # rather than subosito/flutter-action. FVM's global default on the Mini
      # is an older SDK, so this repo's pinned version goes first on PATH;
      # both fastlane lanes shell out to `flutter`. Homebrew's bin directory
      # goes on PATH too, for fvm, ruby and bundle.
      - name: Select Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          fvm install "$FLUTTER_VERSION"
          sdk="$HOME/fvm/versions/$FLUTTER_VERSION"
          have="$("$sdk/bin/flutter" --version | head -1)"
          echo "$have"
          case "$have" in "Flutter $FLUTTER_VERSION"*) ;; *) echo "Flutter version mismatch"; exit 1 ;; esac
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$sdk/bin" >> "$GITHUB_PATH"

      - name: Confirm later steps will use the pinned Flutter
        run: |
          got="$(command -v flutter)"
          want="$HOME/fvm/versions/$FLUTTER_VERSION/bin/flutter"
          echo "flutter resolves to $got"
          [ "$got" = "$want" ] || { echo "expected $want"; exit 1; }

      # Gems go in the runner's tool cache, not Homebrew's Ruby directory:
      # RubyGems can't write there (its rdoc plugin file is a symlink into
      # the Cellar), and the tool cache survives between jobs so later runs
      # skip the download. Frozen, like the old bundler-cache setup, so the
      # lockfile is never rewritten.
      - name: Point Bundler at a directory the runner owns
        run: |
          echo "BUNDLE_PATH=$RUNNER_TOOL_CACHE/randoeats-bundle" >> "$GITHUB_ENV"
          echo "BUNDLE_FROZEN=true" >> "$GITHUB_ENV"

      - name: Install gems
        run: bundle install

      - name: Install dependencies
        run: flutter pub get

      - name: Create Google Services JSON
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      - name: Create keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/randoeats-release.keystore

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=upload
          storeFile=randoeats-release.keystore
          EOF

      - name: Create service account file
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" | base64 --decode > firebase-service-account.json

      - name: Build and distribute
        env:
          FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: firebase-service-account.json
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          # Google Maps SDK key — gradle reads MAPS_API_KEY from the env into the
          # manifest placeholder. Without it the map view crashes (New Area).
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: bundle exec fastlane android distribute

      # The runner keeps its files between jobs, unlike a throwaway VM, so
      # the credential files written above must not be left behind.
      - name: Cleanup credentials
        if: always()
        run: rm -f android/app/google-services.json android/app/randoeats-release.keystore android/key.properties firebase-service-account.json

  # ============================================
  # iOS Build
  # ============================================
  ios:
    needs: increment-build
    if: github.event.inputs.platform != 'android'
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      # Runs on the Mac Mini self-hosted runner, not a GitHub-hosted macOS
      # VM. See the android job for why Flutter comes from FVM and gems go in
      # the runner's tool cache.
      - name: Select Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          fvm install "$FLUTTER_VERSION"
          sdk="$HOME/fvm/versions/$FLUTTER_VERSION"
          have="$("$sdk/bin/flutter" --version | head -1)"
          echo "$have"
          case "$have" in "Flutter $FLUTTER_VERSION"*) ;; *) echo "Flutter version mismatch"; exit 1 ;; esac
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$sdk/bin" >> "$GITHUB_PATH"

      - name: Confirm later steps will use the pinned Flutter
        run: |
          got="$(command -v flutter)"
          want="$HOME/fvm/versions/$FLUTTER_VERSION/bin/flutter"
          echo "flutter resolves to $got"
          [ "$got" = "$want" ] || { echo "expected $want"; exit 1; }

      - name: Point Bundler at a directory the runner owns
        run: |
          echo "BUNDLE_PATH=$RUNNER_TOOL_CACHE/randoeats-bundle" >> "$GITHUB_ENV"
          echo "BUNDLE_FROZEN=true" >> "$GITHUB_ENV"

      - name: Install gems
        run: bundle install

      - name: Install dependencies
        run: flutter pub get

      - name: Pod install (with repo update)
        run: cd ios && bundle exec pod install --repo-update

      - name: Create GoogleService-Info.plist
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Create Secrets.xcconfig (Google Maps SDK key)
        # GMSApiKey in Info.plist is $(MAPS_API_KEY) from this gitignored file;
        # without it GMSServices gets an empty key and the map view crashes
        # (tapping "New Area"). Empty when the secret is unset (map stays gray).
        run: echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" > ios/Flutter/Secrets.xcconfig

      - name: Create service account file
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" | base64 --decode > firebase-service-account.json

      - name: Setup SSH for Match
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}

      # The Fastfile calls setup_ci whenever CI is set, which creates a
      # temporary keychain and makes it the user's DEFAULT keychain. On a
      # throwaway VM that is invisible; on a machine that outlives the job it
      # would leave the default pointing at a temp keychain. Remember the real
      # default now and put it back afterwards.
      #
      # The Mini is shared with other repos' iOS jobs, which do the same swap
      # under the same name (fastlane_tmp_keychain). Two of them running at
      # once would collide, so don't dispatch iOS deploys for two repos
      # together.
      - name: Remember the default keychain
        run: |
          prev="$(security default-keychain -d user | tr -d ' "')"
          echo "PREVIOUS_DEFAULT_KEYCHAIN=$prev" >> "$GITHUB_ENV"

      - name: Build and distribute
        env:
          FIREBASE_APP_ID_IOS: ${{ secrets.FIREBASE_APP_ID_IOS }}
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: firebase-service-account.json
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: bundle exec fastlane ios distribute

      - name: Restore the default keychain
        if: always()
        run: |
          if [ -n "${PREVIOUS_DEFAULT_KEYCHAIN:-}" ]; then
            security default-keychain -d user -s "$PREVIOUS_DEFAULT_KEYCHAIN"
          fi
          security delete-keychain fastlane_tmp_keychain 2>/dev/null || true

      # The runner keeps its files between jobs, unlike a throwaway VM, so
      # the credential files written above must not be left behind.
      - name: Cleanup credentials
        if: always()
        run: rm -f ios/Runner/GoogleService-Info.plist ios/Flutter/Secrets.xcconfig firebase-service-account.json
