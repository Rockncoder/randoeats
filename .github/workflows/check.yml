# The uniform TekAdept command contract, run in CI.
#
# Adapted from tekadept-template/.github/workflows/check.yml. The stock version
# is a bare `just check` on an empty runner; this project needs the Flutter
# toolchain and LLVM (for the BFF's clang-format/clang-tidy rings) before the
# contract can run at all.
#
# NOTE: this workflow is expected to FAIL until the items under "Harness gaps"
# in BACKLOG.adoc are resolved — `just analyze` runs `dart run custom_lint`,
# which is not a dependency of this project yet. It is committed in its correct
# form rather than weakened to go green; see MIGRATION-NOTES.adoc.
#
# It deliberately overlaps with .github/workflows/main.yaml for now. main.yaml
# remains the gate that protects `main` — and note that main.yaml is currently
# STRICTER, because it enforces a coverage floor that `just check` has no local
# equivalent for. Collapsing the two is a follow-up.

name: check

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          cache: true

      - name: Install LLVM (clang-format, clang-tidy)
        run: sudo apt-get update && sudo apt-get install -y clang-format clang-tidy

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: flutter pub get

      - name: just check
        run: just check
