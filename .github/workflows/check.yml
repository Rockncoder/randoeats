# The uniform TekAdept command contract, run in CI.
#
# Adapted from tekadept-template/.github/workflows/check.yml. The stock version
# is a bare `just check` on an empty runner; this project needs the Flutter
# toolchain and LLVM (for the BFF's clang-format/clang-tidy rings) before the
# contract can run at all.
#
# NOTE: this workflow is expected to FAIL until the items under "Harness gaps"
# in BACKLOG.adoc are resolved — `just analyze` runs `dart run custom_lint`,
# which is not a dependency of this project yet. It is committed in its correct
# form rather than weakened to go green; see MIGRATION-NOTES.adoc.
#
# `just check` now includes the BFF unit tests (spec 001), so the runner needs
# Drogon itself, not just LLVM. Before that step existed the C++ rings failed
# with "Could not find a package configuration file provided by Drogon" — the
# lint gate was never actually running in CI.
#
# It deliberately overlaps with .github/workflows/main.yaml for now. main.yaml
# remains the gate that protects `main` — and note that main.yaml is currently
# STRICTER, because it enforces a coverage floor that `just check` has no local
# equivalent for. Collapsing the two is a follow-up.

name: check

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          cache: true

      # Ubuntu 24.04 ships clang-tidy 18, which rejects the whole .clang-tidy
      # with "unknown key 'ExcludeHeaderFilterRegex'" — that key needs 19+ —
      # and a rejected config means NO checks run, reporting zero findings that
      # look like clean code. 19 is not in the distro repos, so install from
      # LLVM's own apt repo and point the gate at it explicitly rather than
      # fighting /usr/bin/clang-tidy.
      - name: Install LLVM 19
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main"
          sudo apt-get update
          sudo apt-get install -y clang-format-19 clang-tidy-19
          clang-tidy-19 --version | head -1


      # `just check` builds and runs the BFF unit tests, so Drogon must be
      # present. Before this existed the C++ rings failed with "Could not find a
      # package configuration file provided by Drogon" -- the lint gate was
      # never actually running in CI.
      #
      # Built from source rather than installed from apt. Ubuntu's
      # libdrogon-dev is built WITH the database backends, so DrogonConfig.cmake
      # re-runs find_dependency() for jsoncpp, MySQL, PostgreSQL and SQLite --
      # and a consumer build then fails on each in turn, for features this BFF
      # does not use. (Ubuntu ships MariaDB, whose headers Drogon's FindMySQL
      # does not accept, so that chain does not terminate cleanly.) A pinned
      # source build with the backends off removes the whole class of failure
      # and is cached, so it costs one slow run and then nothing.
      #
      # NOTE: the ORM and every database backend are OFF here. Spec 002
      # (durable cache) targets the PostgreSQL already running on the host and
      # needs Drogon's orm::DbClient, so -DBUILD_ORM=ON -DBUILD_POSTGRESQL=ON
      # must be set in the same change that implements it -- otherwise the
      # Postgres path works in the production image and is untestable in CI,
      # which is the worst of both.
      - name: Install Drogon build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjsoncpp-dev uuid-dev zlib1g-dev libssl-dev

      - name: Cache Drogon
        id: cache-drogon
        uses: actions/cache@v4
        with:
          path: ~/drogon-install
          key: drogon-1.9.12-nodb-${{ runner.os }}

      - name: Build Drogon
        if: steps.cache-drogon.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.9.12 \
            https://github.com/drogonframework/drogon /tmp/drogon
          git -C /tmp/drogon submodule update --init --recursive
          cmake -S /tmp/drogon -B /tmp/drogon/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/drogon-install" \
            -DBUILD_EXAMPLES=OFF -DBUILD_CTL=OFF -DBUILD_ORM=OFF \
            -DBUILD_POSTGRESQL=OFF -DBUILD_MYSQL=OFF -DBUILD_SQLITE=OFF \
            -DBUILD_REDIS=OFF
          cmake --build /tmp/drogon/build -j"$(nproc)"
          cmake --install /tmp/drogon/build

      - name: Expose Drogon to CMake
        run: echo "CMAKE_PREFIX_PATH=$HOME/drogon-install" >> "$GITHUB_ENV"

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install dependencies
        run: flutter pub get

      - name: just check
        env:
          CLANG_TIDY: clang-tidy-19
          CLANG_FORMAT: clang-format-19
        run: just check

      # The sanitizer ring is kept out of `just check` because it rebuilds
      # instrumented and roughly doubles the wall time. CI is where it runs.
      - name: just bff-test-asan
        run: just bff-test-asan
